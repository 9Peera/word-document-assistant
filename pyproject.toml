[build-system]
requires = ["setuptools~=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# This is an NVDA add-on, not a Python package: uv only installs the build and test tools.
package = false

[project]
name = "wordDocAssistant"
# Keep in step with addon_version in buildVars.py.
version = "1.0.1"
description = "NVDA add-on for Microsoft Word document work"
maintainers = [
	{name = "Peera Pilarit", email = "9peera@gmail.com"},
]
requires-python = ">=3.13,<3.14"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]
readme = "readme.md"
license = {file = "COPYING.TXT"}
# This package is not installed as a library; every dependency is tooling used to
# build, translate, or lint the add-on. They are declared as PEP 735 dependency groups.
dependencies = []
[project.urls]
Repository = "https://github.com/9Peera/word-document-assistant"

# PEP 735 dependency groups. `uv sync` installs the `dev` group by default, which
# pulls in every tool needed to build, translate, and lint the add-on.
[dependency-groups]
# Build add-on
build = [
	"scons==4.10.1",
	"Markdown==3.10",
]
# Translations management
l10n = [
	"nh3==0.3.2",
	"crowdin-api-client==1.24.1",
	"lxml==6.1.0",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
]
# Lint
lint = [
	"uv==0.11.15",
	"ruff==0.14.5",
	"prek==0.4.8",
	"pyright[nodejs]==1.1.407",
]
dev = [
	{ include-group = "build" },
	{ include-group = "l10n" },
	{ include-group = "lint" },
]

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	".venv",
	"buildVars.py",
	"tests",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	# indentation contains tabs
	"W191",
]
logger-objects = ["logHandler.log"]

[tool.ruff.lint.per-file-ignores]
# sconscripts contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonPlatform = "Windows"
pythonVersion = "3.13"
# Standard checks. NVDA's own modules (api, config, gui, ...) are provided by NVDA at run time
# and are not installable, so imports of them cannot be resolved here.
typeCheckingMode = "standard"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportAttributeAccessIssue = "warning"

include = [
	"addon",
	"devtools",
	"buildVars.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	".venv",
	"site_scons",
	".github/scripts",
	"tests",
]

extraPaths = [
	"./addon",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
